 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الجدول الدوري للعناصر الكيميائية</title>
<style>
  :root{
    --navy-900:#050b1a;
    --navy-800:#0a1530;
    --navy-700:#122048;
    --navy-600:#1a2c5e;
    --gold:#d4af37;
    --gold-light:#f3d878;
    --text:#eef1fb;
    --text-dim:#9aa6c9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Tahoma','Segoe UI',sans-serif;
    background:radial-gradient(ellipse at top, var(--navy-800), var(--navy-900) 70%);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
  .star{position:absolute;background:#fff;border-radius:50%;opacity:.7;animation:twinkle 3s infinite ease-in-out;}
  @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}

  header{
    text-align:center;
    padding:28px 16px 14px;
    position:relative;
    z-index:1;
  }
  header h1{
    color:var(--gold-light);
    font-size:1.8em;
    text-shadow:0 0 18px rgba(212,175,55,.5);
    letter-spacing:1px;
  }
  header p{color:var(--text-dim);margin-top:6px;font-size:.95em;}

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    padding:0 16px 18px;
    position:relative;
    z-index:1;
  }
  .toolbar button{
    background:var(--navy-700);
    border:1px solid var(--navy-600);
    color:var(--text);
    padding:7px 14px;
    border-radius:20px;
    font-size:.82em;
    cursor:pointer;
    transition:.2s;
  }
  .toolbar button:hover{border-color:var(--gold);color:var(--gold-light);}
  .toolbar button.active{
    background:linear-gradient(135deg,var(--gold),#b8860b);
    color:var(--navy-900);
    font-weight:bold;
    border-color:var(--gold);
  }

  .table-wrap{
    overflow-x:auto;
    padding:10px 10px 30px;
    position:relative;
    z-index:1;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(18, minmax(38px,1fr));
    gap:3px;
    width:max-content;
    margin:0 auto;
    direction:ltr;
  }
  .cell{
    width:44px;height:44px;
    border-radius:6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:.6em;
    background:var(--navy-700);
    border:1px solid rgba(255,255,255,.06);
    transition:.15s;
    position:relative;
  }
  .cell:hover{
    transform:scale(1.18);
    z-index:5;
    box-shadow:0 0 14px rgba(212,175,55,.6);
    border-color:var(--gold);
  }
  .cell .num{position:absolute;top:2px;left:3px;font-size:.75em;color:rgba(255,255,255,.55);}
  .cell .sym{font-size:1.35em;font-weight:bold;line-height:1;}
  .cell.dim{opacity:.18;filter:grayscale(.6);}
  .cell.placeholder{visibility:hidden;pointer-events:none;}
  .cell.selected{outline:3px solid var(--gold-light);transform:scale(1.2);z-index:6;}

  /* category colors */
  .cat-alkali{background:#7a2f2f;}
  .cat-alkaline{background:#8a5a2f;}
  .cat-transition{background:#2f6a7a;}
  .cat-post{background:#2f5d7a;}
  .cat-metalloid{background:#4a7a3f;}
  .cat-nonmetal{background:#3f7a5c;}
  .cat-halogen{background:#7a6a2f;}
  .cat-noble{background:#5c2f7a;}
  .cat-lanth{background:#7a2f6a;}
  .cat-act{background:#7a3f2f;}
  .cat-unknown{background:#3a3a4a;}

  .legend{
    display:flex;flex-wrap:wrap;gap:8px;
    justify-content:center;
    padding:0 16px 20px;
    font-size:.72em;
    position:relative;z-index:1;
  }
  .legend span{
    display:flex;align-items:center;gap:5px;
    background:rgba(255,255,255,.03);
    padding:3px 9px;border-radius:12px;
  }
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block;}

  /* Info panel */
  #overlay{
    position:fixed;inset:0;background:rgba(2,6,18,.75);
    backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;
    z-index:50;padding:16px;
  }
  #overlay.show{display:flex;}
  #panel{
    background:linear-gradient(160deg,var(--navy-700),var(--navy-800));
    border:1px solid var(--gold);
    border-radius:16px;
    max-width:420px;width:100%;
    padding:22px;
    box-shadow:0 0 40px rgba(212,175,55,.25);
    max-height:85vh;overflow-y:auto;
    position:relative;
  }
  #panel .close{
    position:absolute;top:12px;left:14px;
    background:none;border:none;color:var(--text-dim);
    font-size:1.4em;cursor:pointer;
  }
  .panel-head{display:flex;align-items:center;gap:16px;margin-bottom:12px;}
  .panel-symbol{
    width:70px;height:70px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:2em;font-weight:bold;flex-shrink:0;
  }
  .panel-head h2{color:var(--gold-light);font-size:1.3em;}
  .panel-head .num-mass{color:var(--text-dim);font-size:.85em;margin-top:3px;}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0;}
  .info-item{
    background:rgba(255,255,255,.04);
    border-radius:8px;padding:8px 10px;font-size:.82em;
  }
  .info-item b{color:var(--gold-light);display:block;font-size:.78em;margin-bottom:2px;}
  .panel-desc{font-size:.88em;line-height:1.7;color:var(--text);margin-top:10px;}
  .panel-uses{font-size:.85em;line-height:1.7;color:var(--text-dim);margin-top:8px;}

  /* Quiz */
  #quizBtn{
    display:block;margin:0 auto 30px;
    background:linear-gradient(135deg,var(--gold),#b8860b);
    color:var(--navy-900);border:none;
    padding:12px 30px;border-radius:24px;
    font-weight:bold;font-size:1em;cursor:pointer;
    box-shadow:0 4px 18px rgba(212,175,55,.3);
    position:relative;z-index:1;
  }
  #quizArea{
    max-width:520px;margin:0 auto 40px;
    background:var(--navy-700);
    border:1px solid var(--navy-600);
    border-radius:16px;padding:22px;
    display:none;position:relative;z-index:1;
  }
  #quizArea.show{display:block;}
  #quizArea h3{color:var(--gold-light);margin-bottom:14px;font-size:1.05em;}
  .q-text{font-size:1em;margin-bottom:14px;line-height:1.6;}
  .q-opts{display:grid;gap:8px;}
  .q-opt{
    background:var(--navy-600);border:1px solid transparent;
    padding:10px 14px;border-radius:10px;cursor:pointer;
    font-size:.9em;transition:.15s;text-align:right;
  }
  .q-opt:hover{border-color:var(--gold);}
  .q-opt.correct{background:#2f6a3f;border-color:#5cba6f;}
  .q-opt.wrong{background:#6a2f2f;border-color:#ba5c5c;}
  #quizFeedback{margin-top:12px;font-size:.88em;min-height:20px;color:var(--gold-light);}
  #quizScore{margin-top:10px;font-size:.82em;color:var(--text-dim);}
  #nextQBtn{
    margin-top:14px;background:var(--navy-800);color:var(--text);
    border:1px solid var(--gold);padding:8px 18px;border-radius:20px;
    cursor:pointer;font-size:.85em;display:none;
  }
  footer{text-align:center;padding:16px;color:var(--text-dim);font-size:.75em;position:relative;z-index:1;}

  @media (max-width:600px){
    .cell{width:34px;height:34px;font-size:.55em;}
    #grid{grid-template-columns:repeat(18, minmax(30px,1fr));}
    header h1{font-size:1.35em;}
  }
</style>
</head>
<body>
<div id="stars"></div>

<header>
  <h1>⚛️ الجدول الدوري للعناصر الكيميائية</h1>

</header>

</div>

<footer>محاكاة تعليمية تفاعلية · الجدول الدوري للعناصر</footer>

// خانات فارغة (اللانثانيدات/الأكتينيدات المختزلة إلى صف 3 عمود 3، وبقية العناصر غير المذكورة تُترك فارغة شفافة)
const GRID_ROWS = 7, GRID_COLS = 18;

/* ============ بناء الجدول ============ */
const grid = document.getElementById('grid');
const cellMap = {};
for(let r=1;r<=GRID_ROWS;r++){
  for(let c=1;c<=GRID_COLS;c++){
    const div = document.createElement('div');
    div.className = 'cell placeholder';
    div.dataset.r=r; div.dataset.c=c;
    grid.appendChild(div);
    cellMap[r+'-'+c]=div;
  }
}
ELEMENTS.forEach(el=>{
  const cell = cellMap[el.r+'-'+el.c];
  if(!cell) return;
  cell.className = 'cell ' + CATS[el.cat].cls;
  cell.innerHTML = `<span class="num">${el.n}</span><span class="sym">${el.s}</span>`;
  cell.dataset.symbol = el.s;
  cell.addEventListener('click', ()=>openPanel(el));
});

/* ============ شريط الفئات (تصفية) ============ */
const toolbar = document.getElementById('toolbar');
const allBtn = document.createElement('button');
allBtn.textContent = 'الكل'; allBtn.className='active';
allBtn.onclick = ()=>filterCat(null, allBtn);
toolbar.appendChild(allBtn);
Object.entries(CATS).forEach(([key,val])=>{
  if(!ELEMENTS.some(e=>e.cat===key)) return;
  const b=document.createElement('button');
  b.textContent = val.name;
  b.onclick = ()=>filterCat(key,b);
  toolbar.appendChild(b);
});
function filterCat(cat, btn){
  [...toolbar.children].forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.cell:not(.placeholder)').forEach(c=>{
    if(!cat) c.classList.remove('dim');
    else c.classList.toggle('dim', !c.classList.contains(CATS[cat].cls));
  });
}

/* ============ وسيلة الإيضاح ============ */
const legend = document.getElementById('legend');
Object.entries(CATS).forEach(([key,val])=>{
  if(!ELEMENTS.some(e=>e.cat===key)) return;
  const s=document.createElement('span');
  s.innerHTML = `<i class="${val.cls}"></i>${val.name}`;
  legend.appendChild(s);
});

/* ============ لوحة المعلومات ============ */
const overlay = document.getElementById('overlay');
const panelContent = document.getElementById('panelContent');
function openPanel(el){
  document.querySelectorAll('.cell').forEach(c=>c.classList.remove('selected'));
  const cell = document.querySelector(`.cell[data-symbol="${el.s}"]`);
  if(cell) cell.classList.add('selected');
  panelContent.innerHTML = `
    <div class="panel-head">
      <div class="panel-symbol ${CATS[el.cat].cls}">${el.s}</div>
      <div>
        <h2>${el.name}</h2>
        <div class="num-mass">العدد الذري: ${el.n} · الكتلة الذرية: ${el.mass}</div>
      </div>
    </div>
    <div class="info-grid">
      <div class="info-item"><b>التصنيف</b>${CATS[el.cat].name}</div>
      <div class="info-item"><b>الحالة الفيزيائية</b>${el.state}</div>
    </div>
    <div class="panel-desc">${el.desc}</div>
    <div class="panel-uses"><b style="color:var(--gold-light)">الاستخدامات: </b>${el.uses}</div>
  `;
  overlay.classList.add('show');
}
document.getElementById('closePanel').onclick = ()=>overlay.classList.remove('show');
overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.classList.remove('show'); });

/* ============ الاختبار التفاعلي ============ */
const quizBtn = document.getElementById('quizBtn');
const quizArea = document.getElementById('quizArea');
const qText = document.getElementById('qText');
const qOpts = document.getElementById('qOpts');
const feedback = document.getElementById('quizFeedback');
const scoreEl = document.getElementById('quizScore');
const nextBtn = document.getElementById('nextQBtn');

let score=0, total=0, currentQ=null;
const QUESTION_TYPES = ['symbolToName','nameToSymbol','category','number'];

function pickRandom(arr,n){
  const copy=[...arr]; const out=[];
  while(out.length<n && copy.length){
    out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]);
  }
  return out;
}

function newQuestion(){
  feedback.textContent=''; nextBtn.style.display='none';
  const type = QUESTION_TYPES[Math.floor(Math.random()*QUESTION_TYPES.length)];
  const el = ELEMENTS[Math.floor(Math.random()*ELEMENTS.length)];
  let question, correct, options;

  if(type==='symbolToName'){
    question = `ما اسم العنصر الذي رمزه <b style="color:var(--gold-light);font-size:1.2em">${el.s}</b> ؟`;
    correct = el.name;
    options = pickRandom(ELEMENTS.filter(e=>e.n!==el.n),3).map(e=>e.name);
  } else if(type==='nameToSymbol'){
    question = `ما رمز عنصر <b style="color:var(--gold-light)">${el.name}</b> ؟`;
    correct = el.s;
    options = pickRandom(ELEMENTS.filter(e=>e.n!==el.n),3).map(e=>e.s);
  } else if(type==='category'){
    question = `إلى أي فئة ينتمي عنصر <b style="color:var(--gold-light)">${el.name} (${el.s})</b> ؟`;
    correct = CATS[el.cat].name;
    const otherCats = Object.entries(CATS).filter(([k])=>k!==el.cat && ELEMENTS.some(e=>e.cat===k)).map(([k,v])=>v.name);
    options = pickRandom(otherCats,3);
  } else {
    question = `ما العدد الذري لعنصر <b style="color:var(--gold-light)">${el.name} (${el.s})</b> ؟`;
    correct = String(el.n);
    const others = pickRandom(ELEMENTS.filter(e=>e.n!==el.n),3).map(e=>String(e.n));
    options = others;
  }

  options.push(correct);
  options = options.sort(()=>Math.random()-0.5);
  currentQ = {correct};
  qText.innerHTML = question;
  qOpts.innerHTML='';
  options.forEach(opt=>{
    const b=document.createElement('div');
    b.className='q-opt';
    b.textContent=opt;
    b.onclick=()=>answer(b,opt);
    qOpts.appendChild(b);
  });
}

function answer(btn, opt){
  if(currentQ.answered) return;
  currentQ.answered=true;
  total++;
  const correct = opt===currentQ.correct;
  if(correct) score++;
  [...qOpts.children].forEach(o=>{
    if(o.textContent===currentQ.correct) o.classList.add('correct');
    else if(o===btn) o.classList.add('wrong');
  });
  feedback.textContent = correct ? '✅ إجابة صحيحة!' : `❌ غير صحيح. الإجابة الصحيحة: ${currentQ.correct}`;
  scoreEl.textContent = `النتيجة: ${score} من ${total}`;
  nextBtn.style.display='inline-block';
}

quizBtn.onclick = ()=>{
  quizArea.classList.toggle('show');
  if(quizArea.classList.contains('show')) newQuestion();
};
nextBtn.onclick = newQuestion;

/* ============ خلفية نجوم ============ */
const starsC = document.getElementById('stars');
for(let i=0;i<80;i++){
  const s=document.createElement('div');
  s.className='star';
  const size = Math.random()*2+1;
  s.style.width=s.style.height=size+'px';
  s.style.top=Math.random()*100+'%';
  s.style.left=Math.random()*100+'%';
  s.style.animationDelay=(Math.random()*3)+'s';
  starsC.appendChild(s);
}
</script>
</body>
